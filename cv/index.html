<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV — Ido Herling</title>
<meta name="description" content="CV of Ido Herling — PPE & Law at Tel Aviv University. Decision science, risk, markets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f1ea; --ink:#141414; --mute:#6b6862; --rule:#d6d1c6; --accent:#d9481c;
    --display:'Archivo',system-ui,sans-serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){ :root{ --paper:#121212; --ink:#ece8df; --mute:#9a958c; --rule:#2c2b28; } }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--paper);color:var(--ink)}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased;max-width:960px;margin:0 auto;padding:40px 28px 56px}
  a{color:inherit;text-decoration:none}
  .mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
         border-top:6px solid var(--ink);padding-top:16px;margin-bottom:20px}
  h1{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.03em}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{font-family:var(--mono);font-size:13px;letter-spacing:.05em;text-transform:uppercase;
       border:1.5px solid var(--ink);padding:10px 16px;transition:background .15s,color .15s}
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn.primary{background:var(--ink);color:var(--paper)}
  .btn.primary:hover{background:var(--accent);border-color:var(--accent)}
  .frame{border:1.5px solid var(--ink);background:#fff;height:calc(100vh - 170px);min-height:560px}
  .frame object{width:100%;height:100%;display:block}
  .fallback{padding:40px;text-align:center;font-size:16px}
  .mobile{display:none}
  @media (max-width:620px){ body{padding:24px 16px 40px} .frame{display:none} .mobile{display:block;padding:24px 0;font-size:16px} }
</style>
</head>
<body>
<header>
  <div>
    <a class="mono" href="../">← Ido Herling</a>
    <h1>Curriculum Vitae</h1>
  </div>
  <nav class="actions">
    <a class="btn primary" href="../cv.pdf" download="Ido_Herling_CV.pdf">Download PDF</a>
    <a class="btn" href="../cv.pdf" target="_blank" rel="noopener">Open ↗</a>
  </nav>
</header>

<div class="frame">
  <object data="../cv.pdf#view=FitH" type="application/pdf" aria-label="Ido Herling CV">
    <p class="fallback">Your browser can’t show the PDF here. <a href="../cv.pdf" style="border-bottom:1.5px solid var(--accent)">Open the CV ↗</a></p>
  </object>
</div>
<p class="mobile">Tap <b>Open</b> to view the CV, or <b>Download PDF</b> to save it.</p>
</body>
</html>
